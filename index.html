<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada con MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Extras para GLB -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .mensaje {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 9999;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="mensaje">
    Permite el acceso a la cámara y apunta a la imagen objetivo.
</div>

<a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
        <a-asset-item
            id="modelo3d"
            src="modelo.glb">
        </a-asset-item>
    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-light
        type="ambient"
        intensity="1.5"
        color="#ffffff">
    </a-light>

    <a-light
        type="directional"
        intensity="2"
        position="0 2 1"
        color="#ffffff">
    </a-light>

    <a-entity mindar-image-target="targetIndex: 0">

        <a-gltf-model
            src="#modelo3d"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.2 0.2 0.2"
            animation-mixer>
        </a-gltf-model>

    </a-entity>

</a-scene>

</body>
</html>
